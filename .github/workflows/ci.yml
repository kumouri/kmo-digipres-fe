name: ci

on:
  push:
    branches: [main]
    # CI-04: doc-only merges skip CI; mirrors the pull_request filter below.
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + smoke
    runs-on: ubuntu-latest
    # Raised 15 -> 30: the Playwright smoke suite grows with each shipped module;
    # combined with playwright.config CI workers 1 -> 2 (parallel) this gives ample
    # headroom. If it approaches the cap again, shard the smoke across a matrix.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI-04: the Playwright smoke suite runs on PRs only — the merge commit was already
      # smoke-tested by the PR before it landed (re-running on main push was pure
      # duplication; kmosf-homepage already learned this). Push to main keeps the cheap
      # typecheck + build canary below so a bad merge state still surfaces, but skips the
      # ~83%-of-CI-time browser install + smoke run.
      - name: Cache Playwright browsers
        if: github.event_name == 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache hit: only the (uncacheable) apt OS-deps. Miss: full browser + deps install.
      - name: Install Playwright (chromium + deps)
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Codegen drift check
        run: npm run gen:api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7
