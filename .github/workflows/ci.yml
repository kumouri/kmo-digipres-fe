name: ci

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + smoke
    runs-on: ubuntu-latest
    # Playwright's official image ships the browsers + their OS deps preinstalled, so we
    # skip the per-run `playwright install --with-deps` (the apt step was never cached
    # and ran on every job). The tag MUST track @playwright/test in package-lock.json
    # (currently 1.60.0) — bump both together, or smoke fails on a browser/SDK mismatch.
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Codegen drift check
        run: npm run gen:api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7
